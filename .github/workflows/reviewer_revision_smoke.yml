name: Reviewer revision smoke test
on:
  push:
    branches:
      - tmp-reviewer-revision-20260921
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check dataset access
        shell: bash
        run: |
          python - <<'PY'
          import requests, pathlib
          url="https://dqanonymousdata.blob.core.windows.net/neurips-public/data.zip"
          r=requests.get(url, stream=True, timeout=30)
          print("status", r.status_code, "length", r.headers.get("content-length"))
          r.raise_for_status()
          chunk=next(r.iter_content(1024))
          pathlib.Path("smoke_status.txt").write_text(f"status={r.status_code}\nfirst_bytes={chunk[:8]!r}\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-status
          path: smoke_status.txt
