name: Reviewer revision dataset transfer
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  fetch-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Download official Eedi archive
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 --retry-delay 5 \
            -o eedi_neurips_2020_data.zip \
            https://dqanonymousdata.blob.core.windows.net/neurips-public/data.zip
          ls -lh eedi_neurips_2020_data.zip
          sha256sum eedi_neurips_2020_data.zip | tee eedi_neurips_2020_data.sha256
          unzip -t eedi_neurips_2020_data.zip >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: eedi-neurips-2020-official-data
          path: |
            eedi_neurips_2020_data.zip
            eedi_neurips_2020_data.sha256
          compression-level: 0
          retention-days: 1
